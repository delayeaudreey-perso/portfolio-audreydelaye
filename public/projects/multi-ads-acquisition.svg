<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 536" width="944" height="536" role="img" aria-label="A catalogue of five offers, one excluded, three selected into an email, and performance measured by email context">
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#f1dfe0" stop-opacity="0.9" />
      <stop offset="1" stop-color="#f1dfe0" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#98504b" flood-opacity="0.10" />
    </filter>
  </defs>

  <rect width="944" height="536" fill="#faf8f4" />
  <rect width="944" height="536" fill="url(#glow)" />
  <circle cx="110" cy="440" r="150" fill="#faf1ef" />
  <circle cx="850" cy="80" r="170" fill="#faf1ef" />

  <g transform="translate(472 268) scale(0.8) translate(-496 -268)">
    <!-- Catalogue: five offers, the first one already owned (excluded) -->
    <g filter="url(#soft)">
      <rect x="236" y="156" width="76" height="36" rx="10" fill="#ffffff" stroke="#d6d3d1" stroke-dasharray="4 4" opacity="0.7" />
      <rect x="236" y="200" width="76" height="36" rx="10" fill="#ffffff" stroke="#e7e5e4" />
      <rect x="236" y="244" width="76" height="36" rx="10" fill="#ffffff" stroke="#e7e5e4" />
      <rect x="236" y="288" width="76" height="36" rx="10" fill="#ffffff" stroke="#e7e5e4" />
      <rect x="236" y="332" width="76" height="36" rx="10" fill="#ffffff" stroke="#e7e5e4" />
    </g>
    <g opacity="0.55">
      <circle cx="252" cy="174" r="6" fill="#d6d3d1" />
      <rect x="266" y="171" width="36" height="6" rx="3" fill="#d6d3d1" />
      <path d="M244 184 L 304 164" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" />
    </g>
    <g fill="#b8706a">
      <circle cx="252" cy="218" r="6" />
      <circle cx="252" cy="262" r="6" />
      <circle cx="252" cy="306" r="6" />
    </g>
    <g fill="#e7e5e4">
      <circle cx="252" cy="350" r="6" />
      <rect x="266" y="347" width="36" height="6" rx="3" />
    </g>
    <g fill="#e7e5e4">
      <rect x="266" y="215" width="36" height="6" rx="3" />
      <rect x="266" y="259" width="36" height="6" rx="3" />
      <rect x="266" y="303" width="36" height="6" rx="3" />
    </g>

    <!-- Selection: catalogue -> email -->
    <g fill="none" stroke="#b8706a" stroke-width="2" stroke-linecap="round">
      <path d="M312 218 C 338 218, 340 222, 364 222" />
      <path d="M312 262 C 338 262, 340 288, 364 288" />
      <path d="M312 306 C 338 306, 340 354, 364 354" />
    </g>

    <!-- The email with three selected offers -->
    <g filter="url(#soft)">
      <rect x="364" y="136" width="204" height="264" rx="16" fill="#ffffff" stroke="#e7e5e4" />
    </g>
    <circle cx="388" cy="160" r="8" fill="#f1dfe0" />
    <rect x="404" y="154" width="84" height="6" rx="3" fill="#d6d3d1" />
    <rect x="404" y="166" width="56" height="5" rx="2.5" fill="#e7e5e4" />
    <rect x="384" y="188" width="164" height="5" rx="2.5" fill="#e7e5e4" />
    <g>
      <rect x="384" y="204" width="164" height="52" rx="10" fill="#faf1ef" stroke="#f1dfe0" />
      <rect x="384" y="204" width="5" height="52" rx="2.5" fill="#b8706a" />
      <rect x="400" y="218" width="64" height="7" rx="3.5" fill="#b8706a" />
      <rect x="400" y="234" width="110" height="5" rx="2.5" fill="#e7e5e4" />
    </g>
    <g>
      <rect x="384" y="270" width="164" height="52" rx="10" fill="#faf1ef" stroke="#f1dfe0" />
      <rect x="384" y="270" width="5" height="52" rx="2.5" fill="#b8706a" />
      <rect x="400" y="284" width="76" height="7" rx="3.5" fill="#b8706a" />
      <rect x="400" y="300" width="96" height="5" rx="2.5" fill="#e7e5e4" />
    </g>
    <g>
      <rect x="384" y="336" width="164" height="52" rx="10" fill="#faf1ef" stroke="#f1dfe0" />
      <rect x="384" y="336" width="5" height="52" rx="2.5" fill="#b8706a" />
      <rect x="400" y="350" width="56" height="7" rx="3.5" fill="#b8706a" />
      <rect x="400" y="366" width="104" height="5" rx="2.5" fill="#e7e5e4" />
    </g>

    <!-- Measurement: email + context + ad -> performance -->
    <g fill="none" stroke="#b8706a" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 6">
      <path d="M568 230 C 590 230, 592 262, 612 262" />
      <path d="M568 296 C 590 296, 592 276, 612 276" />
      <path d="M568 362 C 590 362, 592 290, 612 290" />
    </g>
    <g filter="url(#soft)">
      <rect x="612" y="206" width="144" height="172" rx="14" fill="#ffffff" stroke="#e7e5e4" />
    </g>
    <rect x="628" y="224" width="52" height="6" rx="3" fill="#b8706a" />
    <g fill="#f1dfe0">
      <rect x="630" y="332" width="16" height="30" rx="3" />
      <rect x="656" y="312" width="16" height="50" rx="3" />
      <rect x="682" y="296" width="16" height="66" rx="3" />
      <rect x="708" y="318" width="16" height="44" rx="3" />
    </g>
    <rect x="682" y="296" width="16" height="66" rx="3" fill="#b8706a" />
    <g fill="#e7e5e4">
      <rect x="628" y="248" width="30" height="14" rx="7" />
      <rect x="664" y="248" width="40" height="14" rx="7" />
      <rect x="710" y="248" width="26" height="14" rx="7" />
    </g>
    <rect x="664" y="248" width="40" height="14" rx="7" fill="#faf1ef" stroke="#b8706a" />
  </g>
</svg>
